# Tests, then publishes the static site (index.html, css, js, assets, data) to GitHub Pages.
# Repository settings: Pages > Build and deployment > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Optional: the high-resolution imagery (npm run data:hires, ~0.4 GB, not in git: the browser prefers it when it is
      # there). Building it here downloads from swisstopo's public WMS on every deploy (~10-15 min; cwebp and PIL needed);
      # GitHub Pages sites are limited to 1 GB. Uncomment to publish it, or host data/hires/ on object storage instead.
      # - run: sudo apt-get install -y webp python3-pil
      # - run: npm run data:hires
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R index.html .nojekyll css js assets data _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
